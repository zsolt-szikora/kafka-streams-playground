name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The Maven wrapper + parent pom live in app/. `verify` runs the full
      # build incl. surefire (unit) and failsafe (integration) tests.
      - name: Build and test
        working-directory: app
        run: ./mvnw -B --no-transfer-progress verify
